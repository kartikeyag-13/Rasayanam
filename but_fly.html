const GeometricDistortShader = {
    uniforms: {
        'tDiffuse':    { value: null },
        'uGeoMode':    { value: 0 },     // 0=off 1=kaleid 2=mirrorH 3=mirrorV 4=pixelate 5=fisheye 6=bulge 7=polar
        'uGeoAmount':  { value: 0.5 },   // generic strength / amount
        'uSegments':   { value: 6.0 },   // kaleidoscope segments (3–16)
        'uPixelSize':  { value: 8.0 },   // pixelate block size (2–64)
        'uResolution': { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform int   uGeoMode;
        uniform float uGeoAmount;
        uniform float uSegments;
        uniform float uPixelSize;
        uniform vec2  uResolution;
        varying vec2  vUv;

        #define PI  3.14159265358979
        #define PI2 6.28318530718

        void main() {
            if (uGeoMode == 0) { gl_FragColor = texture2D(tDiffuse, vUv); return; }

            vec2 uv = vUv;

            // ── 1. Kaleidoscope ───────────────────────────────────────────────
            if (uGeoMode == 1) {
                vec2 p = uv - 0.5;
                float r = length(p);
                float a = atan(p.y, p.x);
                float sliceAngle = PI2 / uSegments;
                a = mod(a, sliceAngle);
                if (a > sliceAngle * 0.5) a = sliceAngle - a; // mirror within slice
                uv = vec2(r * cos(a), r * sin(a)) + 0.5;
            }
            // ── 2. Mirror Horizontal ─────────────────────────────────────────
            else if (uGeoMode == 2) {
                uv.x = uv.x < 0.5 ? uv.x : 1.0 - uv.x;
            }
            // ── 3. Mirror Vertical ───────────────────────────────────────────
            else if (uGeoMode == 3) {
                uv.y = uv.y < 0.5 ? uv.y : 1.0 - uv.y;
            }
            // ── 4. Pixelate ───────────────────────────────────────────────────
            else if (uGeoMode == 4) {
                vec2 blockSize = vec2(uPixelSize) / uResolution;
                uv = floor(uv / blockSize) * blockSize + blockSize * 0.5;
            }
            // ── 5. Fisheye / Spherize ─────────────────────────────────────────
            else if (uGeoMode == 5) {
                vec2 p = uv * 2.0 - 1.0;
                float len = length(p);
                if (len < 1.0) {
                    float z = sqrt(1.0 - len * len * uGeoAmount);
                    float theta = atan(len / z) * (1.0 / PI);
                    uv = p * (theta / len) * 0.5 + 0.5;
                }
            }
            // ── 6. Bulge / Pinch ──────────────────────────────────────────────
            else if (uGeoMode == 6) {
                vec2 p = uv - 0.5;
                float dist = length(p);
                float factor = pow(dist, uGeoAmount > 0.5 ? 0.6 : 1.8);
                uv = normalize(p + 0.00001) * factor * 0.5 + 0.5;
            }
            // ── 7. Polar Coordinates ──────────────────────────────────────────
            else if (uGeoMode == 7) {
                float r = uv.y;
                float a = (uv.x - 0.5) * PI2;
                uv = vec2(r * cos(a), r * sin(a)) * 0.5 + 0.5;
            }

            gl_FragColor = texture2D(tDiffuse, clamp(uv, 0.001, 0.999));
        }
    `
};
// --- INJECTED SHADER CONSTANTS ---
const ColorGradeCompositeShader = {
    uniforms: {
        "tDiffuse":    { value: null },
        "bgColor":     { value: new THREE.Color(0x000000) },
        "uBrightness": { value: 0.0 },   // -0.5 → +0.5
        "uContrast":   { value: 1.0 },   // 0.0 → 3.0
        "uSaturation": { value: 1.0 },   // 0.0 → 3.0
        "uHueShift":   { value: 0.0 },   // 0.0 → 1.0 (full rotation)
        "uExposure":   { value: 1.0 },   // 0.1 → 4.0
        "uToneMap":    { value: 0 },     // 0=off 1=ACES 2=Reinhard 3=Filmic
        "uTintColor":  { value: new THREE.Color(0xffffff) },
        "uTintShadow": { value: new THREE.Color(0x000000) },
        "uTintAmt":    { value: 0.0 },   // 0.0 → 1.0
        "uInvert":     { value: 0.0 },   // 0=off 1=on
        "uSolarize":   { value: 0.0 },   // 0=off 0–1=threshold
        "uPosterize":  { value: 0.0 },   // 0=off 2–8=bands
    },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform vec3  bgColor;
        uniform float uBrightness;
        uniform float uContrast;
        uniform float uSaturation;
        uniform float uHueShift;
        uniform float uExposure;
        uniform int   uToneMap;
        uniform vec3  uTintColor;
        uniform vec3  uTintShadow;
        uniform float uTintAmt;
        uniform float uInvert;
        uniform float uSolarize;
        uniform float uPosterize;
        varying vec2  vUv;

        // Hue rotation matrix (lossless, works on any colour)
        vec3 rotateHue(vec3 col, float h) {
            float ang = h * 6.28318530718;
            float c = cos(ang), s = sin(ang);
            float sq = 0.57735026919; // 1/sqrt(3)
            // Rodrigues rotation around grey axis (1,1,1)/sqrt(3)
            return col * c
                + cross(vec3(sq,sq,sq), col) * s
                + vec3(sq,sq,sq) * dot(vec3(sq,sq,sq), col) * (1.0 - c);
        }

        // Tone mapping
        vec3 acesToneMap(vec3 x){
            return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.,1.);
        }
        vec3 reinhardToneMap(vec3 x){ return x/(x+1.); }
        vec3 filmicToneMap(vec3 x){
            vec3 X=max(vec3(0.),x-0.004);
            return (X*(6.2*X+0.5))/(X*(6.2*X+1.7)+0.06);
        }

        void main() {
            vec4 texel = texture2D(tDiffuse, vUv);

            // 1. Background composite
            float bgAlpha = clamp(max(texel.r, max(texel.g, texel.b)), 0.0, 1.0);
            vec3 col = texel.rgb + bgColor * (1.0 - bgAlpha);

            // 2. Exposure
            col *= uExposure;

            // 3. Tone mapping
            if (uToneMap == 1) col = acesToneMap(col);
            else if (uToneMap == 2) col = reinhardToneMap(col);
            else if (uToneMap == 3) col = filmicToneMap(col);

            // 4. Brightness
            col = col + uBrightness;

            // 5. Contrast  (pivot at 0.5)
            col = (col - 0.5) * uContrast + 0.5;

            // 6. Saturation
            float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
            col = mix(vec3(lum), col, uSaturation);

            // 7. Hue shift
            if (uHueShift != 0.0) col = rotateHue(col, uHueShift);

            // 8. Duotone (shadow→highlight colour remap)
            if (uTintAmt > 0.0) {
                float lumDt = dot(col, vec3(0.2126, 0.7152, 0.0722));
                vec3 duotone = mix(uTintShadow, uTintColor, lumDt);
                col = mix(col, duotone, uTintAmt);
            }

            // 9. Solarize  (partial invert above threshold)
            if (uSolarize > 0.0) {
                float lumS = dot(col, vec3(0.2126, 0.7152, 0.0722));
                float mask = step(uSolarize, lumS);
                col = mix(col, 1.0 - col, mask);
            }

            // 10. Invert
            if (uInvert > 0.5) col = 1.0 - col;

            // 11. Posterize
            if (uPosterize >= 2.0) {
                float bands = uPosterize;
                col = floor(col * bands + 0.5) / bands;
            }

            gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
        }
    `
};

const LiquidMarbleShader = {
    uniforms: {
        'tDiffuse': { value: null },
        'time': { value: 0.0 },
        'strength': { value: 0.0 },
        'speed': { value: 0.5 },
        'scale': { value: 3.0 }
    },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float time;
        uniform float strength;
        uniform float speed;
        uniform float scale;
        varying vec2 vUv;
        float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
        float noise(vec2 p){
            vec2 i=floor(p); vec2 f=fract(p);
            vec2 u=f*f*(3.0-2.0*f);
            return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);
        }
        vec2 fbm2(vec2 p){
            float f=0.0; float a=0.5;
            for(int i=0;i<5;i++){ f+=a*noise(p); p*=2.0; a*=0.5; }
            return vec2(f, noise(p+vec2(3.7,1.3)));
        }
        void main(){
            if(strength==0.0){ gl_FragColor=texture2D(tDiffuse,vUv); return; }
            vec2 p = vUv * scale;
            float t = time * speed;
            // Domain warp — each layer warps the coordinate space of the next
            vec2 q = fbm2(p + t);
            vec2 r = fbm2(p + q + vec2(1.7+t*0.15, 9.2+t*0.05));
            vec2 warp = fbm2(p + r);
            vec2 sampledUv = clamp(vUv + (warp - 0.5) * strength * 0.4, 0.001, 0.999);
            gl_FragColor = texture2D(tDiffuse, sampledUv);
        }
    `
};

const TwirlShader = {
    uniforms: {
        'tDiffuse': { value: null },
        'angle': { value: 0.0 },
        'radius': { value: 0.5 },
        'center': { value: new THREE.Vector2(0.5, 0.5) }
    },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float angle;
        uniform float radius;
        uniform vec2 center;
        varying vec2 vUv;
        void main(){
            vec2 delta = vUv - center;
            float dist = length(delta);
            float twirlAngle = angle * max(0.0, (radius - dist) / radius);
            float c = cos(twirlAngle), s = sin(twirlAngle);
            vec2 rotated = vec2(c*delta.x - s*delta.y, s*delta.x + c*delta.y);
            gl_FragColor = texture2D(tDiffuse, clamp(center + rotated, 0.001, 0.999));
        }
    `
};

const WaveWarpShader = {
    uniforms: {
        'tDiffuse': { value: null },
        'time': { value: 0.0 },
        'freqX': { value: 10.0 },
        'freqY': { value: 10.0 },
        'amplitude': { value: 0.0 },
        'speed': { value: 1.0 }
    },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float time;
        uniform float freqX;
        uniform float freqY;
        uniform float amplitude;
        uniform float speed;
        varying vec2 vUv;
        void main(){
            if(amplitude==0.0){ gl_FragColor=texture2D(tDiffuse,vUv); return; }
            float t = time * speed;
            vec2 displaced = vUv + vec2(
                sin(vUv.y * freqX + t) * amplitude,
                cos(vUv.x * freqY + t) * amplitude
            );
            gl_FragColor = texture2D(tDiffuse, clamp(displaced, 0.001, 0.999));
        }
    `
};

const FluidChromaShader = {
    uniforms: {
        'tDiffuse': { value: null },
        'time': { value: 0.0 },
        'strength': { value: 0.0 },
        'dispersion': { value: 0.02 },
        'speed': { value: 0.5 }
    },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float time;
        uniform float strength;
        uniform float dispersion;
        uniform float speed;
        varying vec2 vUv;
        
        void main() {
            if(strength == 0.0) { gl_FragColor = texture2D(tDiffuse, vUv); return; }
            
            float t = time * speed;
            vec2 p = vUv - 0.5;
            
            // Large scale, smooth, organic flow using trig functions instead of high-frequency noise
            float x1 = sin(p.y * 3.1 + t * 0.7) * cos(p.x * 2.1 + t * 0.9);
            float y1 = cos(p.x * 3.4 - t * 0.6) * sin(p.y * 2.3 - t * 0.8);
            
            float x2 = sin(p.y * 5.2 - t * 1.2 + x1) * cos(p.x * 4.1 + t * 1.1 + y1);
            float y2 = cos(p.x * 5.5 + t * 1.3 - x1) * sin(p.y * 4.3 - t * 1.0 - y1);
            
            // Smooth directional vector
            vec2 dir = vec2(x2, y2) * strength * 0.2;
            
            // Heavy chromatic aberration on the fluid edges
            float rCol = texture2D(tDiffuse, clamp(vUv + dir * (1.0 + dispersion * 2.0), 0.001, 0.999)).r;
            float gCol = texture2D(tDiffuse, clamp(vUv + dir, 0.001, 0.999)).g;
            float bCol = texture2D(tDiffuse, clamp(vUv + dir * (1.0 - dispersion * 2.0), 0.001, 0.999)).b;
            
            // Add a subtle iridescent sheen based on the flow derivative
            float sheen = dot(dir, vec2(0.5)) * 2.0;
            vec3 iridescence = vec3(
                0.5 + 0.5 * sin(sheen * 10.0 + 0.0),
                0.5 + 0.5 * sin(sheen * 10.0 + 2.0),
                0.5 + 0.5 * sin(sheen * 10.0 + 4.0)
            ) * 0.15 * strength;

            gl_FragColor = vec4(vec3(rCol, gCol, bCol) + iridescence, 1.0);
        }
    `
};

const PixelMeltShader = {
    uniforms: {
        'tDiffuse': { value: null },
        'time': { value: 0.0 },
        'amount': { value: 0.0 },
        'threshold': { value: 0.5 },
        'angle': { value: 0.0 }
    },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float time;
        uniform float amount;
        uniform float threshold;
        uniform float angle;
        varying vec2 vUv;
        
        float hash(float n) { return fract(sin(n)*43758.5453); }
        float noise(vec2 p) {
            vec2 ip = floor(p); vec2 u = fract(p); u = u*u*(3.0-2.0*u);
            float res = mix(
                mix(hash(ip.x+ip.y*57.0), hash(ip.x+1.0+ip.y*57.0), u.x),
                mix(hash(ip.x+(ip.y+1.0)*57.0), hash(ip.x+1.0+(ip.y+1.0)*57.0), u.x), u.y);
            return res;
        }

        void main() {
            if(amount == 0.0) { gl_FragColor = texture2D(tDiffuse, vUv); return; }
            
            float angRad = angle * 3.14159265 / 180.0;
            vec2 dir = vec2(cos(angRad), sin(angRad));
            
            vec2 perp = vec2(-dir.y, dir.x);
            float lineCoord = dot(vUv, perp);
            
            float n = noise(vec2(lineCoord * 100.0, time * 0.5));
            float n2 = noise(vec2(lineCoord * 50.0, time * 0.2));
            
            float displacement = 0.0;
            if (n > threshold) {
                displacement = (n - threshold) * amount * 0.5 + n2 * amount * 0.5;
            }
            
            vec2 uvOffset = vUv - dir * displacement;
            vec4 col = texture2D(tDiffuse, clamp(uvOffset, 0.001, 0.999));
            gl_FragColor = col;
        }
    `
};

const CrystalPrismShader = {
    uniforms: {
        'tDiffuse': { value: null },
        'time': { value: 0.0 },
        'facets': { value: 10.0 },
        'refraction': { value: 0.05 },
        'dispersion': { value: 0.02 }
    },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float time;
        uniform float facets;
        uniform float refraction;
        uniform float dispersion;
        varying vec2 vUv;
        
        vec2 hash2(vec2 p) {
            p = vec2(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3)));
            return fract(sin(p)*43758.5453);
        }
        
        void main() {
            if(refraction <= 0.0) { gl_FragColor = texture2D(tDiffuse, vUv); return; }
            
            vec2 p = vUv * facets;
            vec2 n = floor(p);
            vec2 f = fract(p);
            
            vec2 m_point;
            float m_dist = 8.0;
            
            for(int j=-1; j<=1; j++)
            for(int i=-1; i<=1; i++) {
                vec2 g = vec2(float(i),float(j));
                vec2 o = hash2(n + g);
                o = 0.5 + 0.5*sin(time * 0.2 + 6.2831*o);
                vec2 r = g + o - f;
                float d = dot(r,r);
                if(d < m_dist) {
                    m_dist = d;
                    m_point = r;
                }
            }
            
            vec2 edgeDist = min(vUv, 1.0 - vUv);
            float edgeFade = smoothstep(0.0, 0.05, min(edgeDist.x, edgeDist.y));
            vec2 warp = m_point * refraction * edgeFade;
            
            float rCol = texture2D(tDiffuse, clamp(vUv + warp * (1.0 + dispersion), 0.001, 0.999)).r;
            float gCol = texture2D(tDiffuse, clamp(vUv + warp, 0.001, 0.999)).g;
            float bCol = texture2D(tDiffuse, clamp(vUv + warp * (1.0 - dispersion), 0.001, 0.999)).b;
            
            float highlight = smoothstep(0.2, 0.0, length(m_point)) * 0.15 * clamp(refraction * 10.0, 0.0, 1.0);
            
            gl_FragColor = vec4(rCol + highlight, gCol + highlight, bCol + highlight, 1.0);
        }
    `
};

const CinematicArtifactShader = {
    uniforms: {
        'tDiffuse':       { value: null },
        'uHalation':      { value: 0.0 },  // 0.0 → 1.0
        'uHalationColor': { value: new THREE.Color(0xff4400) },
        'uScanlines':     { value: 0.0 },  // 0.0 → 1.0
        'uScanDensity':   { value: 200.0 },// lines per screen (80–400)
        'uScanSoftness':  { value: 0.5 },  // edge softness
        'uResolution':    { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float uHalation;
        uniform vec3  uHalationColor;
        uniform float uScanlines;
        uniform float uScanDensity;
        uniform float uScanSoftness;
        uniform vec2  uResolution;
        varying vec2 vUv;

        // Simple box blur (5-tap horizontal) for halation glow
        vec3 boxBlur(vec2 uv, float rad) {
            vec2 px = vec2(rad) / uResolution;
            vec3 c = texture2D(tDiffuse, uv).rgb;
            c += texture2D(tDiffuse, uv + vec2(px.x, 0.)).rgb;
            c += texture2D(tDiffuse, uv - vec2(px.x, 0.)).rgb;
            c += texture2D(tDiffuse, uv + vec2(0., px.y)).rgb;
            c += texture2D(tDiffuse, uv - vec2(0., px.y)).rgb;
            return c / 5.0;
        }

        void main() {
            if (uHalation == 0.0 && uScanlines == 0.0) {
                gl_FragColor = texture2D(tDiffuse, vUv);
                return;
            }
            vec4 texel = texture2D(tDiffuse, vUv);
            vec3 col = texel.rgb;

            // Halation: warm glow around bright edges (film emulation)
            if (uHalation > 0.0) {
                vec3 blurred = boxBlur(vUv, 8.0);
                float brightness = dot(blurred, vec3(0.2126, 0.7152, 0.0722));
                float haloPow = pow(max(0.0, brightness - 0.4), 1.5);
                vec3 haloColor = uHalationColor * haloPow * uHalation * 2.0;
                // Additive blend — mimics light leaking through film layers
                col += haloColor * (1.0 - col); // dodge-style to avoid blowout
            }

            // CRT Scanlines: horizontal dark lines across the screen
            if (uScanlines > 0.0) {
                float lineY = vUv.y * uScanDensity;

const LensSimulationShader = {
    uniforms: {
        'tDiffuse':      { value: null },

        'uShake':        { value: 0.0 },  // 0.0 → 1.0
        'uShakeSpeed':   { value: 3.0 },  // shake frequency
        'uStreaks':       { value: 0.0 }, // 0.0 → 1.0 anamorphic horizontal streaks
        'uStreakColor':  { value: new THREE.Color(0x88aaff) },
        'uResolution':   { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float uTime;
        uniform float uLensDist;
        uniform float uShake;
        uniform float uShakeSpeed;
        uniform float uStreaks;
        uniform vec3  uStreakColor;
        uniform vec2  uResolution;
        varying vec2  vUv;

        // Pseudo-random for shake
        float rand(float n){ return fract(sin(n) * 43758.5453); }

        void main() {
            if (uLensDist == 0.0 && uShake == 0.0 && uStreaks == 0.0) {
                gl_FragColor = texture2D(tDiffuse, vUv);
                return;
            }
            vec2 uv = vUv;

            // ── Camera Shake ─────────────────────────────────────────────────
            if (uShake > 0.0) {
                float t = floor(uTime * uShakeSpeed);
                vec2 shakeOffset = vec2(
                    (rand(t) - 0.5) * 2.0,
                    (rand(t + 1.7) - 0.5) * 2.0
                ) * uShake * 0.015;
                uv += shakeOffset;
            }

            // ── Lens Distortion (barrel k1 radial) ────────────────────────
            if (uLensDist != 0.0) {
                vec2 p = uv * 2.0 - 1.0;
                float r2 = dot(p, p);
                float distortion = 1.0 + uLensDist * r2;
                p *= distortion;
                uv = p * 0.5 + 0.5;
            }

            vec4 col = texture2D(tDiffuse, clamp(uv, 0.001, 0.999));

            // ── Anamorphic Streaks (horizontal lens flare lines) ──────────
            if (uStreaks > 0.0) {
                float brightness = dot(col.rgb, vec3(0.2126, 0.7152, 0.0722));
                float threshold = 0.6;
                float streakIntensity = max(0.0, brightness - threshold) * uStreaks * 3.0;

                // Sample horizontally to create streak
                vec3 streak = vec3(0.0);
                float total = 0.0;
                float maxWidth = 0.3 * uStreaks;
                for (int i = -8; i <= 8; i++) {
                    float offset = float(i) * maxWidth / 8.0;
                    float weight = exp(-float(i*i) * 0.08); // Gaussian falloff along streak
                    vec2 sampleUv = vec2(clamp(uv.x + offset, 0.001, 0.999), uv.y);
                    vec3 s = texture2D(tDiffuse, sampleUv).rgb;
                    float sBright = dot(s, vec3(0.2126, 0.7152, 0.0722));
                    streak += s * weight * max(0.0, sBright - threshold);
                    total += weight;
                }
                streak = (streak / total) * uStreakColor;
                col.rgb += streak * uStreaks * 1.5;
            }

            gl_FragColor = col;
        }
    `
};

                vec2 uv = gl_FragCoord.xy / resolution.xy;
                vec3 pos = texture2D(texturePosition, uv).xyz;
                vec3 vel = texture2D(textureVelocity, uv).xyz;
                vec3 target = texture2D(textureTarget, uv).xyz;

                vec3 force = vec3(0.0);

                // 1. Target Attraction / Spring Force
                if (uPhysicsMode == 0) {
                    vec3 desiredVel = (target - pos) * 25.0;
                    force += (desiredVel - vel) * 40.0;
                } else {
                    vec3 springForce = -uStiffness * (pos - target);
                    force += springForce;
                }

                // 2. Mouse Force
                if (uMouseMode > 0) {
                    float d = distance(pos, uMouse3D);
                    float radius = uMouseInfluence * 15.0;
                    if (d < radius && d > 0.1) {
                        float strength = (1.0 - d / radius);
                        vec3 mouseDir = normalize(pos - uMouse3D);
                        if (uMouseMode == 1) {
                            force -= mouseDir * strength * 150.0;
                        } else if (uMouseMode == 2) {
                            force += mouseDir * strength * 150.0;
                        } else if (uMouseMode == 3) {
                            vec3 up = vec3(0.0, 1.0, 0.0);
                            vec3 tangent = normalize(cross(mouseDir, up));
                            force += tangent * strength * 150.0;
                        }
                    }
                }

                // 3. Curl Noise / Turbulence
                if (uNoiseStrength > 0.0 || uPhysicsMode == 3) {
                    float scale = 0.05;
                    vec3 noiseOffset = curlNoise(pos * scale + vec3(0.0, 0.0, uTime * 0.2));
                    float currentNoiseStrength = uNoiseStrength * (uPhysicsMode == 3 ? 15.0 : 5.0);
                    force += noiseOffset * currentNoiseStrength;
                }

                // 4. Stochastic Flocking
                if (uPhysicsMode == 2) {
                    float seed = fract(sin(dot(uv, vec2(12.9898, 78.233))) * 43758.5453);
                    for(int k = 1; k <= 4; k++) {
                        vec2 sampleUv = fract(uv + vec2(
                            sin(float(k) * 1.7 + seed + uTime) * 0.27,
                            cos(float(k) * 2.3 + seed + uTime) * 0.31
                        ));
                        vec3 otherPos = texture2D(texturePosition, sampleUv).xyz;
                        float d = distance(pos, otherPos);
                        if (d < 4.0 && d > 0.01) {
                            vec3 repelDir = normalize(pos - otherPos);
                            force += repelDir * (1.0 - d / 4.0) * 120.0;
                        }
                    }
                }

                // 5. Gravity Override
                force += uGravity * 100.0;

                // 6. Shockwave (Radial Explosion)
                if (uShockwaveForce > 0.0) {
                    float d = distance(pos, uShockwaveCenter);
                    if (d < uShockwaveRadius && d > 0.1) {
                        float shockStrength = (1.0 - (d / uShockwaveRadius)) * uShockwaveForce;
                        vec3 shockDir = normalize(pos - uShockwaveCenter);
                        force += shockDir * shockStrength * 500.0;
                    }
                }

                vel += force * uDeltaTime;
                vel *= (1.0 - uDamping);

                float maxVel = 800.0;
                if (length(vel) > maxVel) {
                    vel = normalize(vel) * maxVel;
                }

                gl_FragColor = vec4(vel, 1.0);
            }
        `;

        positionVariable = gpuCompute.addVariable("texturePosition", posShader, dtPosition);
        velocityVariable = gpuCompute.addVariable("textureVelocity", velShader, dtVelocity);

        gpuCompute.setVariableDependencies(positionVariable, [positionVariable, velocityVariable]);
        gpuCompute.setVariableDependencies(velocityVariable, [positionVariable, velocityVariable]);

        positionUniforms = positionVariable.material.uniforms;
        velocityUniforms = velocityVariable.material.uniforms;

        velocityUniforms.uTime = { value: 0.0 };
        velocityUniforms.uDeltaTime = { value: 0.016 };
        
        let pModeVal = 1;
        if (PHYSICS_MODE === 'lerp') pModeVal = 0;
        else if (PHYSICS_MODE === 'spring') pModeVal = 1;
        else if (PHYSICS_MODE === 'flocking') pModeVal = 2;
        else if (PHYSICS_MODE === 'fluid') pModeVal = 3;
        velocityUniforms.uPhysicsMode = { value: pModeVal };

        let mModeVal = 0;
        if (MOUSE_MODE === 'attract') mModeVal = 1;
        else if (MOUSE_MODE === 'repel') mModeVal = 2;
        else if (MOUSE_MODE === 'vortex') mModeVal = 3;
        velocityUniforms.uMouseMode = { value: mModeVal };
        velocityUniforms.uMouseInfluence = { value: MOUSE_INFLUENCE };
        velocityUniforms.uMouse3D = { value: new THREE.Vector3() };
        velocityUniforms.textureTarget = { value: targetTex };
        
        velocityUniforms.uStiffness = { value: STIFFNESS };
        velocityUniforms.uDamping = { value: DAMPING };
        velocityUniforms.uNoiseStrength = { value: NOISE_STRENGTH };

        velocityUniforms.uGravity = { value: new THREE.Vector3() };
        velocityUniforms.uShockwaveCenter = { value: new THREE.Vector3() };
        velocityUniforms.uShockwaveForce = { value: 0.0 };
        velocityUniforms.uShockwaveRadius = { value: 0.0 };

        gpuCompute.init();

        // CONTROL STUBS
        const PARAMS = {"cycle":10,"bScale":6,"scatterRadius":160,"drift":0.6,"flowerCount":10,"fieldSpread":110,"fieldCenterY":0,"flowerSize":7,"flapSpeed":6,"flapAmp":0.55};
        const addControl = (id, label, min, max, val) => {
            return PARAMS[id] !== undefined ? PARAMS[id] : val;
        };
        const setInfo = () => {};
        const annotate = () => {};

        const physicsOverrides = {
            gravity: null,
            shockwaveCenter: null,
            shockwaveForce: null,
            shockwaveRadius: null,
            stiffness: null,
            damping: null,
            noiseStrength: null,
        };

        const setPhysics = (options) => {
            if (!options) return;
            if (options.gravity) {
                if (!physicsOverrides.gravity) physicsOverrides.gravity = new THREE.Vector3();
                physicsOverrides.gravity.copy(options.gravity);
            }
            if (options.shockwave) {
                if (options.shockwave.center) {
                    if (!physicsOverrides.shockwaveCenter) physicsOverrides.shockwaveCenter = new THREE.Vector3();
                    physicsOverrides.shockwaveCenter.copy(options.shockwave.center);
                }
                if (options.shockwave.force !== undefined) physicsOverrides.shockwaveForce = options.shockwave.force;
                if (options.shockwave.radius !== undefined) physicsOverrides.shockwaveRadius = options.shockwave.radius;
            }
            if (options.stiffness !== undefined) physicsOverrides.stiffness = options.stiffness;
            if (options.drag !== undefined) physicsOverrides.damping = options.drag;
            if (options.turbulence !== undefined) physicsOverrides.noiseStrength = options.turbulence;
        };

        const setEffects = (options) => {
            if (!options) return;
            if (options.glowIntensity !== undefined && typeof bloomPass !== 'undefined') bloomPass.strength = options.glowIntensity;
            if (options.glowThreshold !== undefined && typeof bloomPass !== 'undefined') bloomPass.threshold = options.glowThreshold;
            if (options.motionTrails !== undefined && typeof afterimagePass !== 'undefined') afterimagePass.uniforms['damp'].value = options.motionTrails;
            if (options.filmGrain !== undefined && typeof filmPass !== 'undefined') {
                filmPass.uniforms['intensity'].value = options.filmGrain;
                filmPass.enabled = options.filmGrain > 0;
            }
            if (options.vignette !== undefined && typeof vignettePass !== 'undefined') vignettePass.uniforms['darkness'].value = options.vignette;
            if (options.gaussianBlur !== undefined && typeof hBlurPass !== 'undefined' && typeof vBlurPass !== 'undefined') {
                if (options.gaussianBlur === 0) {
                    hBlurPass.enabled = false; vBlurPass.enabled = false;
                } else {
                    hBlurPass.enabled = true; vBlurPass.enabled = true;
                    hBlurPass.uniforms['h'].value = options.gaussianBlur / window.innerWidth;
                    vBlurPass.uniforms['v'].value = options.gaussianBlur / window.innerHeight;
                }
            }
            if (options.radialBlur !== undefined && typeof radialBlurPass !== 'undefined') {
                if (options.radialBlur === 0) {
                    radialBlurPass.enabled = false;
                } else {
                    radialBlurPass.enabled = true;
                    radialBlurPass.uniforms['strength'].value = options.radialBlur;
                }
            }
            if (options.bgColor !== undefined) {
                if (typeof bgCompositePass !== 'undefined') bgCompositePass.uniforms['bgColor'].value.set(options.bgColor);
                if (typeof vignettePass !== 'undefined') vignettePass.uniforms['color'].value.set(options.bgColor);
                document.body.style.background = options.bgColor;
            }
        };

        // ANIMATION LOOP
        const clock = new THREE.Clock();

        // Mouse tracking for physics
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const dummyPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        const intersectPoint = new THREE.Vector3();
        
        window.addEventListener('pointermove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime() * SPEED_MULT;
            
            // Shader Time Update
            if(material.uniforms && material.uniforms.uTime) {
                material.uniforms.uTime.value = time;
            }
            if (window.lmPass) window.lmPass.uniforms['time'].value = time;
            if (window.wavePass) window.wavePass.uniforms['time'].value = time;
            if (window.lensPass) window.lensPass.uniforms['uTime'].value = time;
            if (window.liquidGlassPass) window.liquidGlassPass.uniforms['time'].value = time;

            if (velocityUniforms) {
                raycaster.setFromCamera(mouse, camera);
                raycaster.ray.intersectPlane(dummyPlane, intersectPoint);
                velocityUniforms.uMouse3D.value.copy(intersectPoint);
            }

            controls.update();

            // SWARM LOGIC
            const count = COUNT; // Alias for user code compatibility
            for(let i=0; i<COUNT; i++) {
                 // USER CODE INJECTION START
                 // ---- Global timing ----
                 const safeCount = count > 0 ? count : 1;
                 const cycle = addControl("cycle", "Cycle Length (s)", 4, 20, 10);
                 const bScale = addControl("bScale", "Butterfly Size", 6, 30, 16);
                 const scatterRadius = addControl("scatterRadius", "Scatter Spread", 40, 300, 160);
                 const driftStrength = addControl("drift", "Scatter Drift", 0, 1, 0.6);
                 const flowerCount = addControl("flowerCount", "Flower Count", 4, 18, 10);
                 const fieldSpread = addControl("fieldSpread", "Field Radius", 30, 220, 110);
                 const fieldCenterY = addControl("fieldCenterY", "Field Center Height", -60, 60, 0);
                 const flowerSize = addControl("flowerSize", "Flower Size", 3, 14, 7);
                 const flapSpeed = addControl("flapSpeed", "Flap Speed", 1, 12, 6);
                 const flapAmp = addControl("flapAmp", "Flap Amount", 0.1, 1.2, 0.55);
                 
                 const safeCycle = cycle > 0.001 ? cycle : 4;
                 const phase = (time % safeCycle) / safeCycle;
                 const progress = 0.5 - 0.5 * Math.cos(phase * 2.0 * Math.PI);
                 const flapAngle = Math.sin(time * flapSpeed) * flapAmp * progress;
                 const deg = Math.PI / 180.0;
                 const u = i / safeCount;
                 
                 // ---- Scatter cloud: a soft Gaussian ball (Box-Muller) instead of a hard
                 // cube, plus a gentle per-particle drift so it never looks frozen. ----
                 const gh1 = Math.sin(i * 12.9898) * 43758.5453;
                 const gu1 = Math.max(1e-6, gh1 - Math.floor(gh1));
                 const gh2 = Math.sin(i * 78.233) * 12543.987;
                 const gu2 = gh2 - Math.floor(gh2);
                 const gh3 = Math.sin(i * 39.346) * 25563.641;
                 const gu3 = Math.max(1e-6, gh3 - Math.floor(gh3));
                 const gh4 = Math.sin(i * 54.716) * 31415.926;
                 const gu4 = gh4 - Math.floor(gh4);
                 const gRadius1 = Math.sqrt(-2.0 * Math.log(gu1));
                 const gx = gRadius1 * Math.cos(2.0 * Math.PI * gu2);
                 const gy = gRadius1 * Math.sin(2.0 * Math.PI * gu2);
                 const gRadius2 = Math.sqrt(-2.0 * Math.log(gu3));
                 const gz = gRadius2 * Math.cos(2.0 * Math.PI * gu4);
                 
                 const sigma = scatterRadius / 3.0;
                 const driftH = Math.sin(i * 6.283) * 9999.123;
                 const driftPhase = (driftH - Math.floor(driftH)) * 2.0 * Math.PI;
                 const driftAmp = sigma * 0.08 * driftStrength;
                 
                 const sx = gx * sigma + Math.sin(time * 0.3 + driftPhase) * driftAmp;
                 const sy = gy * sigma + Math.cos(time * 0.25 + driftPhase * 1.3) * driftAmp;
                 const sz = gz * sigma + Math.sin(time * 0.2 + driftPhase * 0.7) * driftAmp;
                 
                 // ---- Butterfly's own blue-to-amber blend (shared by all its regions) ----
                 const bfBr = 0.243, bfBg = 0.651, bfBb = 1.0;
                 const bfAr = 0.910, bfAg = 0.639, bfAb = 0.239;
                 const bfColR = bfBr + (bfAr - bfBr) * progress;
                 const bfColG = bfBg + (bfAg - bfBg) * progress;
                 const bfColB = bfBb + (bfAb - bfBb) * progress;
                 
                 let bx = 0.0, by = 0.0, bz = 0.0;
                 let colBaseR = bfColR, colBaseG = bfColG, colBaseB = bfColB;
                 
                 // ---- Region selection: 6 wing/tail lobes, a body, or (past 0.62) a flower ----
                 let regCx = 0.0, regCy = -0.05, regEa = 0.06, regEb = 0.68, regAngle = 0.0, isWing = 0.0;
                 if (u < 0.19344) {
                   regCx = 0.72; regCy = 0.52; regEa = 0.775; regEb = 0.425; regAngle = 32.0 * deg; isWing = 1.0;
                 } else if (u < 0.38688) {
                   regCx = -0.72; regCy = 0.52; regEa = 0.775; regEb = 0.425; regAngle = -32.0 * deg; isWing = 1.0;
                 } else if (u < 0.49476) {
                   regCx = 0.62; regCy = -0.28; regEa = 0.525; regEb = 0.35; regAngle = -28.0 * deg; isWing = 1.0;
                 } else if (u < 0.60264) {
                   regCx = -0.62; regCy = -0.28; regEa = 0.525; regEb = 0.35; regAngle = 28.0 * deg; isWing = 1.0;
                 } else if (u < 0.607476) {
                   regCx = 1.18; regCy = -0.62; regEa = 0.15; regEb = 0.055; regAngle = -55.0 * deg; isWing = 1.0;
                 } else if (u < 0.612312) {
                   regCx = -1.18; regCy = -0.62; regEa = 0.15; regEb = 0.055; regAngle = 55.0 * deg; isWing = 1.0;
                 }
                 
                 if (u < 0.62) {
                   const hr = Math.sin(i * 91.345) * 10000.0;
                   const rFrac = hr - Math.floor(hr);
                   const hp = Math.sin(i * 57.234) * 20000.0;
                   const phiFrac = hp - Math.floor(hp);
                   const radiusFrac = Math.sqrt(rFrac);
                   const phi = phiFrac * 2.0 * Math.PI;
                   const localX = radiusFrac * regEa * Math.cos(phi);
                   const localY = radiusFrac * regEb * Math.sin(phi);
                   const cosA = Math.cos(regAngle);
                   const sinA = Math.sin(regAngle);
                   const wingLocalX = regCx + localX * cosA - localY * sinA;
                   const wingLocalY = regCy + localX * sinA + localY * cosA;
                   bx = wingLocalX * bScale;
                   by = wingLocalY * bScale;
                   bz = Math.abs(wingLocalX) * Math.sin(flapAngle) * bScale * isWing;
                   colBaseR = bfColR;
                   colBaseG = bfColG;
                   colBaseB = bfColB;
                 } else {
                   const flowerU = (u - 0.62) / 0.38;
                   const flowerFloat = flowerU * flowerCount;
                   const flowerIndex = Math.floor(flowerFloat);
                 
                   const th1 = Math.sin(i * 63.71) * 10000.0;
                   const theta = (th1 - Math.floor(th1)) * 2.0 * Math.PI;
                   const th2 = Math.sin(i * 84.19) * 10000.0;
                   const rr = th2 - Math.floor(th2);
                   const petalR = Math.abs(Math.cos(5.0 * theta)) * flowerSize;
                   const radiusFrac2 = Math.sqrt(rr);
                   const petalX = radiusFrac2 * petalR * Math.cos(theta);
                   const petalY = radiusFrac2 * petalR * Math.sin(theta);
                 
                   // Flower centers on a spherical shell all around the butterfly - every
                   // direction and height, not just a flat plane underneath it.
                   const fh1 = Math.sin(flowerIndex * 17.53 + 11.1) * 10000.0;
                   const fhTheta = (fh1 - Math.floor(fh1)) * 2.0 * Math.PI;
                   const fh2 = Math.sin(flowerIndex * 29.13 + 7.7) * 10000.0;
                   const fhCosPhi = (fh2 - Math.floor(fh2)) * 2.0 - 1.0;
                   const fhSinPhi = Math.sqrt(Math.max(0.0, 1.0 - fhCosPhi * fhCosPhi));
                   const fh3 = Math.sin(flowerIndex * 41.91 + 3.3) * 10000.0;
                   const fhJitter = fh3 - Math.floor(fh3);
                   const shellR = fieldSpread * (0.65 + 0.35 * fhJitter);
                   const fieldX = shellR * fhSinPhi * Math.cos(fhTheta);
                   const fieldZ = shellR * fhSinPhi * Math.sin(fhTheta);
                   const fieldY = shellR * fhCosPhi + fieldCenterY;
                 
                   bx = fieldX + petalX * progress;
                   by = fieldY + petalY * progress;
                   bz = fieldZ;
                 
                   const fyR = 0.976, fyG = 0.827, fyB = 0.325;
                   const fpR = 0.976, fpG = 0.416, fpB = 0.686;
                   colBaseR = fyR + (fpR - fyR) * radiusFrac2;
                   colBaseG = fyG + (fpG - fyG) * radiusFrac2;
                   colBaseB = fyB + (fpB - fyB) * radiusFrac2;
                 }
                 
                 // ---- Scatter -> target, with a slow ambient rotation of the whole scene ----
                 const px = sx + (bx - sx) * progress;
                 const py = sy + (by - sy) * progress;
                 const pz = sz + (bz - sz) * progress;
                 
                 const rot = time * 0.05;
                 const cosr = Math.cos(rot);
                 const sinr = Math.sin(rot);
                 const finalX = px * cosr - pz * sinr;
                 const finalZ = px * sinr + pz * cosr;
                 target.set(finalX, py, finalZ);
                 
                 const s4 = Math.sin(i * 3.1415) * 4321.1234;
                 const shimmerPhase = (s4 - Math.floor(s4)) * 2.0 * Math.PI;
                 const glow = 0.85 + 0.15 * Math.sin(time * 2.0 + shimmerPhase);
                 const outR = Math.min(1.0, colBaseR * glow);
                 const outG = Math.min(1.0, colBaseG * glow);
                 const outB = Math.min(1.0, colBaseB * glow);
                 color.setRGB(outR, outG, outB);
                 
                 if (i === 0) {
                   setInfo("Butterfly in a Garden", "Scattered particles bloom into a butterfly surrounded by flowers, then dissolve again.");
                 }
                 // USER CODE INJECTION END
 
                 // UPDATE
                 targets[i].copy(target);
                 positions[i].lerp(targets[i], 0.1);

                 dummy.position.set(0, 0, 0);
                 if ('spark' === 'vector') {
                     const lookDirection = targets[i].clone().sub(positions[i]).normalize().multiplyScalar(2);
                     if (targets[i].distanceToSquared(positions[i]) > 0.1) {
                         dummy.lookAt(lookDirection);
                     }
                 } else if ('spark' === 'plasma' || 'spark' === 'ink' || 'spark' === 'paint') {
                     dummy.lookAt(camera.position); // Billboard
                 } else {
                     dummy.rotation.set(0, 0, 0);
                 }
                 
                 dummy.updateMatrix();
                 instancedMesh.setMatrixAt(i, dummy.matrix);
                 instancedMesh.setColorAt(i, color); // Fix: Use 'color' which user modifies
            }
            instancedMesh.instanceColor.needsUpdate = true;
            if(instancedMesh.geometry.attributes.instanceScale) instancedMesh.geometry.attributes.instanceScale.needsUpdate = true;
            if(instancedMesh.geometry.attributes.instanceOpacity) instancedMesh.geometry.attributes.instanceOpacity.needsUpdate = true;

            updateGPGPUTargets();

            if (velocityUniforms) {
                velocityUniforms.uTime.value = time;
                velocityUniforms.uDeltaTime.value = delta;
                
                if (physicsOverrides.gravity) {
                    velocityUniforms.uGravity.value.copy(physicsOverrides.gravity);
                } else {
                    velocityUniforms.uGravity.value.set(0, 0, 0);
                }
                if (physicsOverrides.shockwaveCenter && physicsOverrides.shockwaveForce !== null) {
                    velocityUniforms.uShockwaveCenter.value.copy(physicsOverrides.shockwaveCenter);
                    velocityUniforms.uShockwaveForce.value = physicsOverrides.shockwaveForce;
                    velocityUniforms.uShockwaveRadius.value = physicsOverrides.shockwaveRadius;
                } else {
                    velocityUniforms.uShockwaveForce.value = 0.0;
                }
                if (physicsOverrides.stiffness !== null) {
                    velocityUniforms.uStiffness.value = physicsOverrides.stiffness;
                } else {
                    velocityUniforms.uStiffness.value = STIFFNESS;
                }
                if (physicsOverrides.damping !== null) {
                    velocityUniforms.uDamping.value = physicsOverrides.damping;
                } else {
                    velocityUniforms.uDamping.value = DAMPING;
                }
                if (physicsOverrides.noiseStrength !== null) {
                    velocityUniforms.uNoiseStrength.value = physicsOverrides.noiseStrength;
                } else {
                    velocityUniforms.uNoiseStrength.value = NOISE_STRENGTH;
                }
            }

            gpuCompute.compute();

            const posTexture = gpuCompute.getCurrentRenderTarget(positionVariable).texture;
            if (material.userData.shader) {
                material.userData.shader.uniforms.texturePosition.value = posTexture;
                material.userData.shader.uniforms.gpgpuEnabled.value = 1.0;
            }
            if (material.uniforms && material.uniforms.texturePosition) {
                material.uniforms.texturePosition.value = posTexture;
                material.uniforms.gpgpuEnabled.value = 1.0;
            }

            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.instanceColor.needsUpdate = true;

            composer.render(delta);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            if (bloomPass) {
                bloomPass.resolution.set(window.innerWidth, window.innerHeight);
            }
            if (typeof hBlurPass !== 'undefined' && hBlurPass && hBlurPass.enabled) {
                hBlurPass.uniforms['h'].value = 0 / window.innerWidth;
            }
            if (typeof vBlurPass !== 'undefined' && vBlurPass && vBlurPass.enabled) {
                vBlurPass.uniforms['v'].value = 0 / window.innerHeight;
            }
        });
    </script>
