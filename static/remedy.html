<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf0e8"><title>Recipe · Rasayanam</title><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--ink:#1b3025;--muted:#68776c;--paper:#edf0e8;--cream:#f8f5ec;--green:#254c39;--gold:#a18450;--line:rgba(28,55,42,.16)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}.wrap{width:min(980px,calc(100% - 40px));margin:auto}.top{padding:26px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font:800 19px Manrope}.back{font-size:12px;text-decoration:none;color:var(--green);border:1px solid var(--line);padding:10px 15px;border-radius:30px}.hero{padding:76px 0 48px}.kicker{font:11px 'DM Mono';letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}h1{font:500 clamp(40px,7vw,70px)/1.02 Manrope;letter-spacing:-.06em;margin:17px 0 12px}.hindi{color:var(--gold);font-size:20px}.summary{font-size:16px;line-height:1.8;color:var(--muted);max-width:720px}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.chip{background:#e1e8dc;border:1px solid var(--line);padding:8px 12px;border-radius:30px;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-bottom:70px}.card{background:var(--cream);border:1px solid var(--line);border-radius:7px;padding:25px}.wide{grid-column:1/-1}.label{font:10px 'DM Mono';letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}h2{font:600 22px Manrope;margin:12px 0 18px}.list{padding-left:21px;color:#536256;line-height:1.9;font-size:14px}.text{font-size:14px;line-height:1.85;color:#536256}.warning{background:#f0e5d3;border-left:3px solid #ad8042;padding:16px 18px;font-size:13px;line-height:1.75;color:#594b36}.source a{color:var(--green)}.error{padding:80px 0;text-align:center}@media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.hero{padding-top:50px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">RASAYANAM</div><a class="back" href="/#remedies">← Back to recipe library</a></header><main id="content"><section class="hero"><div class="kicker">Recipe library · Loading</div><h1>Preparing your recipe…</h1></section></main></div><script>
const id=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function list(items){return '<ol class="list">'+(items||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>'}
fetch('/api/remedies/'+encodeURIComponent(id)).then(r=>{if(!r.ok)throw Error('Recipe not found');return r.json()}).then(({remedy:r})=>{
 document.title=r.name+' · Rasayanam';
 const refs=(r.references||[]).map(x=>'<p class="source"><a target="_blank" rel="noopener" href="'+esc(x.url)+'">'+esc(x.label)+' ↗</a></p>').join('');
 document.getElementById('content').innerHTML=`<section class="hero"><div class="kicker">${esc(r.category||'Home care')} · Recipe detail</div><h1>${esc(r.name)}</h1><div class="hindi">${esc(r.hindi_name||'')}</div><p class="summary">${esc(r.summary||r.benefits||'')}</p><div class="meta"><span class="chip">${r.time_minutes?esc(r.time_minutes)+' min preparation':'Clinician guidance required'}</span><span class="chip">${r.servings?esc(r.servings)+' serving':'No self-dosing instructions'}</span></div></section><section class="grid"><article class="card"><div class="label">01 · Ingredients</div><h2>What you need</h2>${list(r.ingredients||[])}</article><article class="card"><div class="label">02 · Method</div><h2>Preparation</h2>${list(r.preparation||[])}</article><article class="card"><div class="label">03 · Everyday comfort</div><h2>Potential benefits</h2><p class="text">${esc(r.benefits||r.summary||'')}</p><p class="text">${esc(r.evidence_note||'')}</p></article><article class="card"><div class="label">04 · Ayurvedic perspective</div><h2>Traditional context</h2><p class="text">${esc(r.ayurvedic_perspective||'Traditional context is not clinical evidence.')}</p></article><article class="card wide"><div class="label">05 · Read before use</div><h2>Safety & cautions</h2><div class="warning">${esc(r.safety||r.caution||'Check suitability with a qualified clinician.')}</div><p class="text"><b>When to seek help:</b> ${esc(r.when_to_seek_help||'Do not delay medical care for persistent or severe symptoms.')}</p>${refs}</article><article class="card wide"><div class="label">Important distinction</div><h2>Supportive care is not pollution protection</h2><p class="text">No tea, kadha, gargle or home remedy can filter the air you breathe, remove inhaled PM2.5, or make severe outdoor air safe. Follow official AQI guidance, reduce exposure, use a well-fitting N95/FFP2 when needed, and continue prescribed treatment. This page is educational and is not a personal medical prescription.</p></article></section>`;
}).catch(e=>{document.getElementById('content').innerHTML='<section class="error"><h1>Recipe unavailable</h1><p>'+esc(e.message)+'</p><a class="back" href="/#remedies">Return to Rasayanam</a></section>'});
</script></body></html>
